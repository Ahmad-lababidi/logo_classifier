services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: logo_classifier_api
    ports:
      - "8000:8000"
    environment:
      - LOGO_API_KEY=${LOGO_API_KEY:-}
    volumes:
      - ./saved_models:/app/saved_models
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3))['status'] == 'healthy'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: logo_classifier_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/predict
      - LOGO_API_KEY=${LOGO_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
